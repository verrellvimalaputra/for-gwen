<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Selamat Datang 💖</title>
<link rel="stylesheet" href="css/welcome.css">
<script src="https://kit.fontawesome.com/a14ae32021.js" crossorigin="anonymous"></script>
</head>
<body>

<!-- 🎵 Background Music -->
<audio id="welcome-music" autoplay loop muted>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="welcome-container">
  <h1 class="title">🎉 SELAMAT DATANG 🎉</h1>
  <p class="subtitle">di <span class="highlight">KUIS PERRELL</span> yang berhadiah<br>
  <strong>PULUHAN JUTA..... cent 💰</strong></p>

  <button id="start-btn">Hayu mulai GASKEUN BANGGG</button>
</div>

<script>
const music = document.getElementById("welcome-music");
window.addEventListener('load', async () => {
  try {
    await music.play();
    setTimeout(() => music.muted = false, 1000);
  } catch (err) {
    console.log("Autoplay diblokir, musik akan main setelah klik.");
  }
});

document.body.addEventListener('click', () => {
  if (music.paused) {
    music.muted = false;
    music.play();
  }
}, { once: true });

// Pindah ke halaman kuis
document.getElementById("start-btn").addEventListener("click", () => {
  window.location.href = "quiz.html";
});
</script>

<!-- 🎊 CONFETTI SCRIPT -->
<script>
function createConfetti() {
  const colors = ['#ff69b4', '#ffb6c1', '#ffd700', '#87cefa', '#98fb98'];
  const shapes = ['❤️', '💛', '💙', '💚', '💖'];

  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.animationDuration = 4 + Math.random() * 3 + 's';
    confetti.style.fontSize = 16 + Math.random() * 20 + 'px';
    confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(confetti);

    // Hapus setelah selesai jatuh
    setTimeout(() => confetti.remove(), 7000);
  }
}

// Jalankan confetti saat halaman load
window.addEventListener('load', createConfetti);
setInterval(createConfetti, 1000);
</script>

</body>
</html>
